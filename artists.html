<style>
  /* ── Page Artistes ── */
  .artists-hero {
    padding: 120px var(--gutter) 60px;
    text-align: center;
  }
  .artists-hero-tag {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #FF6B35;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .artists-hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 10vw, 120px);
    line-height: 0.9;
    margin-bottom: 20px;
  }
  .artists-hero-title span { color: #FF6B35; }
  .artists-hero-sub {
    font-size: 16px;
    color: var(--muted);
    max-width: 500px;
    margin: 0 auto 40px;
    line-height: 1.6;
  }

  /* ── Filtres ── */
  .artists-filters {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 0 var(--gutter) 40px;
  }
  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: #FF6B35;
    border-color: #FF6B35;
    color: #fff;
  }

  /* ── Grille artistes ── */
  .artists-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    padding: 0 var(--gutter) 80px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .artist-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
    position: relative;
  }
  .artist-card:hover { transform: translateY(-6px); box-shadow: 0 20px 60px #0009; }

  .artist-card-img {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    background: #111;
  }
  .artist-card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
    filter: grayscale(20%);
  }
  .artist-card:hover .artist-card-img img {
    transform: scale(1.08);
    filter: grayscale(0%);
  }

  .artist-card-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60%;
    background: linear-gradient(to top, #000e, transparent);
  }

  .artist-card-flag {
    position: absolute;
    top: 12px; left: 12px;
    font-size: 20px;
    background: #000a;
    border-radius: 6px;
    padding: 4px 8px;
  }

  .artist-card-verified {
    position: absolute;
    top: 12px; right: 12px;
    background: #00F5FF22;
    border: 1px solid #00F5FF44;
    color: #00F5FF;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .artist-card-country {
    position: absolute;
    bottom: 12px; left: 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .artist-card-body {
    padding: 20px;
  }

  .artist-card-name {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .artist-card-genre {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .artist-card-bio {
    font-size: 13px;
    color: #aaa;
    line-height: 1.6;
    margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .artist-card-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
  }
  .artist-stat {
    text-align: center;
  }
  .artist-stat-num {
    font-size: 18px;
    font-weight: 800;
    color: #FF6B35;
  }
  .artist-stat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .artist-card-links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .artist-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    transition: opacity 0.2s;
    letter-spacing: 0.5px;
  }
  .artist-link:hover { opacity: 0.8; }
  .artist-link-articles {
    background: #FF6B3520;
    color: #FF6B35;
  }
  .artist-link-deezer {
    background: #ffffff10;
    color: #aaa;
  }
  .artist-link-yt {
    background: #FF000020;
    color: #FF4444;
  }

  /* ── Modal artiste ── */
  .artist-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10000;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
  }
  .artist-modal.open { display: flex; }

  .artist-modal-backdrop {
    position: fixed;
    inset: 0;
    background: #000d;
    backdrop-filter: blur(10px);
  }

  .artist-modal-inner {
    position: relative;
    width: min(95vw, 700px);
    background: #111;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #333;
    box-shadow: 0 40px 100px #000;
    margin: auto;
  }

  .artist-modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: #fff2;
    border: none;
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    z-index: 2;
    transition: background 0.2s;
  }
  .artist-modal-close:hover { background: #FF6B35; }

  .artist-modal-hero {
    position: relative;
    height: 280px;
    overflow: hidden;
  }
  .artist-modal-hero img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: top;
  }
  .artist-modal-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, #111 0%, transparent 50%);
  }
  .artist-modal-hero-info {
    position: absolute;
    bottom: 20px; left: 24px;
  }
  .artist-modal-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .artist-modal-genre { font-size: 13px; color: #aaa; }

  .artist-modal-body { padding: 24px; }

  .artist-modal-bio {
    font-size: 14px;
    line-height: 1.7;
    color: #ccc;
    margin-bottom: 24px;
  }

  .artist-modal-section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .artist-modal-articles { margin-bottom: 24px; }
  .artist-modal-article {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #222;
    text-decoration: none;
    color: var(--text);
    transition: color 0.2s;
  }
  .artist-modal-article:hover { color: #FF6B35; }
  .artist-modal-article img {
    width: 56px; height: 42px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .artist-modal-article-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }

  .artist-modal-socials {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  @media (max-width: 600px) {
    .artists-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .artist-card-body { padding: 14px; }
    .artist-card-name { font-size: 17px; }
    .artist-card-bio { display: none; }
    .artist-modal-hero { height: 200px; }
    .artist-modal-name { font-size: 36px; }
  }
</style>
</head>

/* ── Render ─────────────────────────────────────── */
const grid = document.getElementById('artists-grid');
let currentFilter = 'all';

function renderArtists(filter = 'all') {
  const filtered = ARTISTS.filter(a => {
    if (filter === 'all') return true;
    if (filter === 'guinee') return a.country === 'guinee';
    if (filter === 'cote_ivoire') return a.country === 'cote_ivoire';
    return a.genres.includes(filter);
  });

  grid.innerHTML = filtered.map(a => `
    <div class="artist-card reveal" data-id="${a.id}" style="--artist-color:${a.color}">
      <div class="artist-card-img">
        <img src="${a.image}" alt="${a.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=500&q=80'">
        <div class="artist-card-overlay"></div>
        <div class="artist-card-flag">${a.flag}</div>
        ${a.verified ? '<div class="artist-card-verified">✓ VÉRIFIÉ</div>' : ''}
        <div class="artist-card-country" style="color:${a.color}">${a.genre}</div>
      </div>
      <div class="artist-card-body">
        <div class="artist-card-name">${a.name}</div>
        <div class="artist-card-genre">${a.genre}</div>
        <div class="artist-card-bio">${a.bio}</div>
        <div class="artist-card-links">
          <button class="artist-link artist-link-articles" onclick="openModal('${a.id}')">
            📄 ${a.articles.length} article${a.articles.length > 1 ? 's' : ''}
          </button>
          <a class="artist-link artist-link-deezer" href="${a.deezer}" target="_blank" rel="noopener">
            🎵 Deezer
          </a>
          <a class="artist-link artist-link-yt" href="${a.youtube}" target="_blank" rel="noopener">
            ▶ YouTube
          </a>
        </div>
      </div>
    </div>
  `).join('');

  // Reveal animation
  setTimeout(() => {
    document.querySelectorAll('.reveal').forEach(el => {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
      }, { threshold: 0.05 });
      obs.observe(el);
    });
  }, 50);

  // Click → modal
  document.querySelectorAll('.artist-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('a')) return;
      if (e.target.closest('button.artist-link-articles')) openModal(card.dataset.id);
      else openModal(card.dataset.id);
    });
  });
}

/* ── Filtres ─────────────────────────────────── */
document.getElementById('artists-filters').querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderArtists(currentFilter);
  });
});

/* ── Modal ───────────────────────────────────── */
function openModal(id) {
  const a = ARTISTS.find(x => x.id === id);
  if (!a) return;

  document.getElementById('am-img').src  = a.image;
  document.getElementById('am-name').textContent  = a.name;
  document.getElementById('am-genre').textContent = a.genre;
  document.getElementById('am-bio').textContent   = a.bio;

  // Articles liés
  const arts = document.getElementById('am-articles');
  const linked = (typeof ARTICLES !== 'undefined')
    ? ARTICLES.filter(art => a.articles.includes(art.id))
    : [];

  if (linked.length) {
    arts.innerHTML = linked.map(art => `
      <a href="article.html?id=${art.id}" class="artist-modal-article">
        <img src="${art.image}" alt="${art.title}">
        <div class="artist-modal-article-title">${art.title}</div>
      </a>`).join('');
  } else {
    arts.innerHTML = '<p style="font-size:13px;color:var(--muted)">Aucun article pour l\'instant.</p>';
  }

  // Socials
  document.getElementById('am-socials').innerHTML = `
    <a class="artist-link artist-link-deezer" href="${a.deezer}" target="_blank">🎵 Deezer</a>
    <a class="artist-link artist-link-yt" href="${a.youtube}" target="_blank">▶ YouTube</a>
  `;

  document.getElementById('artist-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

document.getElementById('artist-modal-close').addEventListener('click', closeModal);
document.getElementById('artist-modal-backdrop').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function closeModal() {
  document.getElementById('artist-modal').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── Init ─────────────────────────────────── */
renderArtists();
</script>

<script src="player.js"></script>
</body>
</html>
